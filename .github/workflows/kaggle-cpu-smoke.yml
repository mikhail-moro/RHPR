name: Kaggle CPU smoke

on:
  push:
    branches:
      - codex/kaggle-experiment-workflow
    paths:
      - .github/workflows/kaggle-cpu-smoke.yml

permissions:
  contents: read

concurrency:
  group: kaggle-${{ github.repository }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL_ID: carasik/rhpr-synthetic-logistic-baseline
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python3 -m pip install kaggle
      - name: Read failed kernel status
        run: kaggle kernels status "$KAGGLE_KERNEL_ID"
      - name: Download failed kernel outputs
        continue-on-error: true
        run: |
          mkdir -p artifacts/kaggle
          kaggle kernels output "$KAGGLE_KERNEL_ID" -p artifacts/kaggle --force
          find artifacts/kaggle -maxdepth 4 -type f -print
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-diagnostics-${{ github.run_id }}
          path: artifacts/kaggle/
          if-no-files-found: warn
          retention-days: 7
