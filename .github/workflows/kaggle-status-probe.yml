name: Kaggle status probe

on:
  push:
    branches:
      - codex/kaggle-experiment-workflow
    paths:
      - .github/workflows/kaggle-status-probe.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL_ID: carasik/rhpr-synthetic-logistic-baseline
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python3 -m pip install kaggle
      - name: Read kernel status
        run: kaggle kernels status "$KAGGLE_KERNEL_ID"
