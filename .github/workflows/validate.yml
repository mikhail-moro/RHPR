name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python3 -m pip install -e .
      - name: Compile
        run: python3 -m compileall -q src scripts kaggle tests
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test experiment
        run: python3 scripts/run_local.py --experiment experiments/baseline.json
