[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhpr"
version = "0.1.0"
description = "Reproducible Kaggle experiment runner for RHPR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sasrec = ["numpy>=1.26", "polars>=1.0", "torch>=2.2"]
search = ["optuna>=4.0,<5"]
long-history = ["numpy>=1.26", "polars>=1.0", "pyarrow>=18", "einops>=0.8.1", "torch>=2.2"]
gr = ["numpy>=1.26", "pyarrow>=18", "torch>=2.2", "transformers==4.47.0", "sentence-transformers==3.3.1", "lightning==2.5.0", "pytorch-lightning==2.5.0", "torchmetrics==1.6.1", "hydra-core==1.3.2", "rich==13.9.4", "python-dotenv==1.0.1"]
genpas-data = ["tensorflow-cpu>=2.18,<2.22", "fastavro>=1.9"]
sid-analysis = ["numpy>=1.26", "pandas>=2", "pyarrow>=18", "scikit-learn>=1.5", "duckdb>=1.1,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
