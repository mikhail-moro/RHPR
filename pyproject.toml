[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhpr"
version = "0.1.0"
description = "Reproducible Kaggle experiment runner for RHPR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sasrec = ["numpy>=1.26", "polars>=1.0", "torch>=2.2"]
search = ["optuna>=4.0,<5"]
long-history = ["numpy>=1.26", "polars>=1.0", "pyarrow>=18", "einops>=0.8.1", "torch>=2.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
